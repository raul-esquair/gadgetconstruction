name: Merge proposed briefs into queue

# When a proposals/content-batch-* PR is merged to main by a human, this
# workflow migrates briefs from content/proposed-briefs.json into
# content/post-queue.json with status "queued", then clears the proposal file.
#
# NOTE: this push trigger only fires for human merges. A merge performed by
# auto-merge-proposals.yml uses the default GITHUB_TOKEN, and GitHub does not
# fire push-triggered workflows from a GITHUB_TOKEN push — so that workflow
# runs scripts/migrate-proposed-briefs.mjs itself instead of relying on this one.
# Both paths call the same script. workflow_dispatch is here for manual recovery.

on:
  push:
    branches: [main]
    paths:
      - "content/proposed-briefs.json"
  workflow_dispatch:

jobs:
  migrate:
    name: Migrate proposed briefs into queue
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrate briefs
        run: node scripts/migrate-proposed-briefs.mjs

      - name: Commit + push
        run: |
          git config user.email "noreply@gadgetconstructionsf.com"
          git config user.name "Gadget Construction Bot"
          git add content/post-queue.json content/proposed-briefs.json content/refresh-briefs.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit \
            -m "Migrate proposed briefs into content queue" \
            -m "Automated migration — the briefs from content/proposed-briefs.json are now in post-queue.json with status=queued. The Friday draft automation will pick them up on their scheduled dates."
          git push
